[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MVSEP-MDX23"
version = "2.0.16"
description = "Music separation model. Forked from https://github.com/jarredou/MVSEP-MDX23-Colab_v2"
dependencies = [
    "numpy",
    "soundfile",
    "scipy",
    "tqdm",
    "librosa",
    "onnxruntime-gpu",
    "pyyaml",
    "ml_collections",
    "samplerate==0.1.0",
    "segmentation_models_pytorch==0.3.3",
    "beartype==0.14.1",
    "rotary_embedding_torch==0.3.5",
    "dora-search>=0.1.12",
    "einops>=0.8.1",
    "lameenc>=1.2",
    "openunmix>=1.3.0",
    "pyyaml",
    "tqdm>=4.66.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = []
